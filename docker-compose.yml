services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      TRADING_MARKET: ${TRADING_MARKET:-BTCUSDT}
      PAPER_START_EQUITY: ${PAPER_START_EQUITY:-10000}
      RISK_PER_TRADE_PCT: ${RISK_PER_TRADE_PCT:-0.01}
      MAX_DAILY_LOSS_PCT: ${MAX_DAILY_LOSS_PCT:-0.03}
      MAX_LEVERAGE: ${MAX_LEVERAGE:-2}
      FEE_BPS: ${FEE_BPS:-6}
      SLIPPAGE_BPS: ${SLIPPAGE_BPS:-2}
      ENABLE_WHALE: ${ENABLE_WHALE:-false}
      POLL_SECONDS: ${POLL_SECONDS:-60}
      DATA_DIR: /app/data
    volumes:
      - bot_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      DATA_DIR: /app/data
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set a random password of at least 32 characters in .env}
    volumes:
      - bot_data:/app/data:ro
    # Private by default: expose only through SSH tunneling or an authenticated TLS proxy.
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      - bot
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  bot_data:

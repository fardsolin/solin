name: Safety and reproducibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -m pip_audit --requirement requirements.txt --strict
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker compose --env-file .env.example config --quiet
        env:
          DASHBOARD_PASSWORD: ci-only-not-a-deployed-credential-0123456789
      - run: docker build -f Dockerfile -t solin-paper .
      - run: docker build -f Dockerfile.dashboard -t solin-dashboard .
      - run: |
          test "$(docker image inspect solin-paper --format '{{.Config.User}}')" = '10001:10001'
          docker run --rm --entrypoint python solin-paper -c "from engine.config import Settings; assert Settings.from_env().market == 'BTCUSDT'"
          docker run --rm --entrypoint python solin-dashboard -c "from dashboard.server import app; assert app.openapi_url is None"
      - name: Read-only shared-volume smoke test
        run: |
          docker volume create solin-ci-state
          docker run --rm --read-only -v solin-ci-state:/app/data --entrypoint python solin-paper -c "from engine.storage import StateStore; s=StateStore('/app/data/paper.sqlite3'); s.heartbeat({'status':'smoke'}); s.close()"
          docker run --rm --read-only -v solin-ci-state:/app/data:ro --entrypoint python solin-dashboard -c "from engine.storage import read_status; assert read_status('/app/data/paper.sqlite3')['heartbeat']['status']=='smoke'"
          docker volume rm solin-ci-state
